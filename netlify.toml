[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ملفات Vite المسماة بالبصمة تُخزَّن للأبد
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# موارد JSON والخطوط والصور المصغرة (قد تتغير بين الإصدارات)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/thumbnails/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
